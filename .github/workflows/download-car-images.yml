name: Download automotive photos
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/download-car-images.yml"
      - "scripts/download_car_images.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: automotive-photo-download
  cancel-in-progress: false
jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download 50 automotive photographs
        run: python scripts/download_car_images.py
      - name: Commit local photographs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/ index.html pages/ assets/css/style.css
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Add 50 locally stored automotive photographs"
            git push
          fi
