<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b63"><title>پنل پیگیری درخواست‌ها | مرکز خرید خودرو و حواله">
<style>
@font-face{font-family:Vazirmatn;src:url('../assets/fonts/Vazirmatn-Regular.woff2') format('woff2');font-weight:400;font-display:swap}@font-face{font-family:Vazirmatn;src:url('../assets/fonts/Vazirmatn-Medium.woff2') format('woff2');font-weight:500;font-display:swap}@font-face{font-family:Vazirmatn;src:url('../assets/fonts/Vazirmatn-SemiBold.woff2') format('woff2');font-weight:600;font-display:swap}@font-face{font-family:Vazirmatn;src:url('../assets/fonts/Vazirmatn-Bold.woff2') format('woff2');font-weight:700 900;font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#f4f7f6;color:#203438;font:13px/1.8 Vazirmatn,Tahoma,sans-serif}button,input,select{font:inherit}a{text-decoration:none;color:inherit}.shell{max-width:1400px;margin:auto;padding:22px}.head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}.brand{font-weight:900;font-size:17px}.brand small{display:block;color:#788a85;font-size:11px;font-weight:500}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #dce7e3;background:#fff;color:#31524c;padding:9px 13px;border-radius:9px;cursor:pointer;font-weight:700;font-size:11px}.btn.primary{background:#176b63;color:#fff;border-color:#176b63}.intro{background:linear-gradient(115deg,#123f3c,#176b63);color:#fff;border-radius:17px;padding:22px 24px;margin-bottom:16px}.intro h1{margin:0 0 4px;font-size:22px}.intro p{margin:0;color:#d9e9e5}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat,.panel{background:#fff;border:1px solid #e1eae6;border-radius:13px;box-shadow:0 5px 18px #204c430b}.stat{padding:15px}.stat span{display:block;color:#778883;font-size:11px}.stat b{font-size:25px;color:#176b63}.panel{padding:16px;margin-bottom:14px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.filters input,.filters select{border:1px solid #dce7e3;background:#f9fbfa;border-radius:9px;padding:9px 11px;min-width:140px;outline-color:#39968a}.filters input{flex:1}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:820px}th,td{text-align:right;padding:11px 10px;border-bottom:1px solid #edf1ef;vertical-align:top}th{font-size:11px;color:#657a74;background:#f7faf8;white-space:nowrap}td{font-size:12px}tr:last-child td{border-bottom:0}.tag{display:inline-block;background:#e8f4f0;color:#176b63;border-radius:6px;padding:3px 7px;font-size:10px}.tag.done{background:#e9f5ed;color:#287348}.tag.reject{background:#fff0ed;color:#a33b2b}.empty{text-align:center;color:#7b8b86;padding:35px}.small{font-size:10px;color:#83918c}.row-actions{display:flex;gap:5px;flex-wrap:wrap}.row-actions button{border:1px solid #dce7e3;background:#fff;border-radius:7px;padding:5px 7px;font-size:10px;cursor:pointer}.notice{font-size:11px;color:#805e24;background:#fff8e9;border:1px solid #efdfb8;border-radius:10px;padding:11px 13px;margin-bottom:14px}.import-label{display:inline-flex;align-items:center;gap:6px}.import-label input{display:none}footer{text-align:center;color:#84928e;padding:14px;font-size:10px}@media(max-width:760px){.shell{padding:12px}.head{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.intro{padding:18px}.intro h1{font-size:19px}.stat b{font-size:22px}}
</style><link rel="stylesheet" href="../assets/css/site-theme.css">
</head><body><div class="shell">
<header class="head"><div class="brand">مرکز خرید خودرو و حواله<small>پنل پیگیری درخواست‌های فروش</small></div><div class="actions"><a class="btn" href="../index.html">نمایش سایت</a><a class="btn primary" href="register-request.html">نمایش فرم ثبت درخواست</a><button class="btn" id="exportBtn">خروجی CSV</button><label class="btn import-label">ورود CSV<input id="importFile" type="file" accept=".csv,text/csv"></label></div></header>
<section class="intro"><h1>درخواست‌های خودرو و حواله</h1><p>نمای فهرست، پیگیری وضعیت و خروجی گرفتن از درخواست‌های ثبت‌شده در همین مرورگر.</p></section>
<div class="notice">محدودیت استقرار فعلی: این سایت روی GitHub Pages اجرا می‌شود؛ این پنل فعلاً داده‌های ذخیره‌شده در همین مرورگر را نمایش می‌دهد و به‌تنهایی درخواست‌های بازدیدکنندگان دیگر را دریافت نمی‌کند. درخواست‌های آنلاین از طریق ایمیل ارسال می‌شوند. برای پنل واقعی چندکاربره، باید پایگاه داده و ورود امن مدیر به سرور متصل شود.</div>
<section class="stats"><div class="stat"><span>کل درخواست‌های محلی</span><b id="total">۰</b></div><div class="stat"><span>در انتظار بررسی</span><b id="newCount">۰</b></div><div class="stat"><span>در حال پیگیری</span><b id="progressCount">۰</b></div><div class="stat"><span>تکمیل‌شده</span><b id="doneCount">۰</b></div></section>
<section class="panel"><div class="filters"><input id="query" placeholder="جستجو در نام، تماس، مدل یا کد پیگیری…"><select id="typeFilter"><option value="">همه درخواست‌ها</option><option>فروش خودرو</option><option>فروش حواله</option></select><select id="statusFilter"><option value="">همه وضعیت‌ها</option><option>جدید</option><option>در حال بررسی</option><option>نیازمند تماس</option><option>تکمیل‌شده</option><option>ردشده</option></select><button class="btn" id="clearFilters">پاک‌کردن فیلتر</button></div>
<div class="table-wrap"><table><thead><tr><th>کد / تاریخ</th><th>نوع</th><th>فروشنده و تماس</th><th>خودرو / طرح</th><th>شهر</th><th>مبلغ پیشنهادی</th><th>وضعیت</th><th>اقدامات</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty">در این مرورگر هنوز درخواستی ثبت نشده است.</div></div></section>
<section class="panel"><b>نکته مدیریت</b><p class="small">برای انتقال فهرست بین مرورگرها، خروجی CSV بگیرید و در پنل دیگر وارد کنید. این قابلیت جایگزین پایگاه داده مرکزی نیست.</p></section><footer>پنل داخلی · مرکز خرید خودرو و حواله</footer></div>
<script>
const KEY='khodroSellerRequestsV1',statuses=['جدید','در حال بررسی','نیازمند تماس','تکمیل‌شده','ردشده'];let rows=read();
function read(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return []}}
function fa(n){return Number(n||0).toLocaleString('fa-IR')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function statusTag(s){return '<span class="tag '+(s==='تکمیل‌شده'?'done':s==='ردشده'?'reject':'')+'">'+esc(s||'جدید')+'</span>'}
function render(){const q=document.getElementById('query').value.trim().toLowerCase(),type=document.getElementById('typeFilter').value,st=document.getElementById('statusFilter').value;const shown=rows.filter(r=>(!type||r['نوع درخواست']===type)&&(!st||(r.status||'جدید')===st)&&(!q||Object.values(r).join(' ').toLowerCase().includes(q)));document.getElementById('total').textContent=fa(rows.length);document.getElementById('newCount').textContent=fa(rows.filter(r=>(r.status||'جدید')==='جدید').length);document.getElementById('progressCount').textContent=fa(rows.filter(r=>['در حال بررسی','نیازمند تماس'].includes(r.status)).length);document.getElementById('doneCount').textContent=fa(rows.filter(r=>r.status==='تکمیل‌شده').length);document.getElementById('empty').style.display=shown.length?'none':'block';document.getElementById('rows').innerHTML=shown.map(r=>'<tr><td><b>'+esc(r.id)+'</b><br><span class="small">'+esc(r.createdAt?new Date(r.createdAt).toLocaleDateString('fa-IR'):'')+'</span></td><td>'+esc(r['نوع درخواست'])+'</td><td><b>'+esc(r['نام فروشنده'])+'</b><br>'+esc(r['شماره تماس'])+'</td><td><b>'+esc(r['مدل خودرو یا عنوان طرح'])+'</b><br><span class="small">'+esc(r['برند یا شرکت'])+'</span></td><td>'+esc(r['شهر'])+'</td><td>'+esc(r['مبلغ پیشنهادی به تومان']||'—')+'</td><td>'+statusTag(r.status)+'</td><td><div class="row-actions"><select aria-label="تغییر وضعیت" data-status="'+esc(r.id)+'">'+statuses.map(s=>'<option '+((r.status||'جدید')===s?'selected':'')+'>'+s+'</option>').join('')+'</select><button data-delete="'+esc(r.id)+'">حذف</button></div></td></tr>').join('');document.querySelectorAll('[data-status]').forEach(el=>el.addEventListener('change',()=>{const r=rows.find(x=>x.id===el.dataset.status);if(r){r.status=el.value;save()}}));document.querySelectorAll('[data-delete]').forEach(el=>el.addEventListener('click',()=>{if(confirm('این درخواست از داده‌های همین مرورگر حذف شود؟')){rows=rows.filter(x=>x.id!==el.dataset.delete);save()}}))}
function save(){localStorage.setItem(KEY,JSON.stringify(rows));render()}
['query','typeFilter','statusFilter'].forEach(id=>document.getElementById(id).addEventListener(id==='query'?'input':'change',render));
document.getElementById('clearFilters').addEventListener('click',()=>{document.getElementById('query').value='';document.getElementById('typeFilter').value='';document.getElementById('statusFilter').value='';render()});
document.getElementById('exportBtn').addEventListener('click',()=>{const all=rows;if(!all.length){alert('درخواستی برای خروجی وجود ندارد.');return}const cols=[...new Set(all.flatMap(Object.keys))],csv='\ufeff'+[cols,...all.map(r=>cols.map(k=>r[k]??''))].map(line=>line.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download='khodro-requests.csv';a.click();URL.revokeObjectURL(a.href)});
document.getElementById('importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;const text=await f.text();const lines=text.replace(/^\ufeff/,'').split(/\r?\n/).filter(Boolean);function parse(line){const a=[];let v='',quoted=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'&&line[i+1]==='"'){v+='"';i++}else if(c==='"')quoted=!quoted;else if(c===','&&!quoted){a.push(v);v=''}else v+=c}a.push(v);return a}const keys=parse(lines.shift());const imported=lines.map(line=>Object.fromEntries(parse(line).map((v,i)=>[keys[i],v]))).filter(r=>r.id);const ids=new Set(rows.map(r=>r.id));rows=[...rows,...imported.filter(r=>!ids.has(r.id))];save();e.target.value='';alert('ورود فایل انجام شد: '+fa(imported.length)+' ردیف بررسی شد.')});
render();
</script></body></html>
